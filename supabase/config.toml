project_id = "gourmet"
[auth]
site_url = "https://marugo-s.github.io/gourmet/"
additional_redirect_urls = ["https://marugo-s.github.io/gourmet/", "http://localhost:5173/gourmet/", "http://localhost:4173/gourmet/"]
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[functions.review-api]
verify_jwt = false
[functions.review-worker]
verify_jwt = false
[functions.agent-api]
verify_jwt = false
