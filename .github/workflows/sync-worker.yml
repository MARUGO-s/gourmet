name: Collect gourmet metrics
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      public_diagnostic:
        description: '公開ページだけを診断（ログイン・DB変更なし）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gourmet-sync-worker
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - if: ${{ inputs.public_diagnostic }}
        run: node scripts/check-public-page.mjs
      - if: ${{ !inputs.public_diagnostic }}
        run: npm run worker
        env:
          GOURMET_WORKER_TOKEN: ${{ secrets.GOURMET_WORKER_TOKEN }}
          SCRAPER_DEBUG_DUMPS: 'false'
